<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Laboratorio de ciencias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;900&family=Lexend:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="juego.css">
</head>
<body>
<div id="gl"></div>

<header id="barra" class="barra" hidden>
  <button id="b-atras" class="hb ancho" type="button" aria-label="Volver a la mesa">← Mesa</button>
  <div class="tarjeta"><b id="t-titulo">Laboratorio</b><span id="t-estrellas" class="est"></span></div>
  <button id="b-sonido" class="hb" type="button" aria-pressed="true" aria-label="Sonido">🔊</button>
</header>

<section id="mision" class="mision" hidden aria-live="polite">
  <div class="m-cab"><span id="m-paso" class="chip"></span><span id="m-puntos" class="puntos"></span></div>
  <p id="m-texto" class="m-texto"></p>
  <p id="m-ayuda" class="m-ayuda"></p>
</section>

<nav id="hub" class="hub" hidden aria-label="Experimentos"></nav>

<div id="toast" class="toast" role="status" hidden></div>

<div id="modal" class="velo" hidden>
  <div class="caja" role="dialog" aria-modal="true" aria-labelledby="mo-titulo">
    <div id="mo-icono" class="mo-icono"></div>
    <h2 id="mo-titulo"></h2>
    <p id="mo-texto"></p>
    <div id="mo-opciones" class="opciones"></div>
    <p id="mo-explica" class="explica" hidden></p>
    <div id="mo-acciones" class="acciones"></div>
  </div>
</div>

<section id="inicio" class="portada">
  <div class="p-caja">
    <div class="p-icono">🔬</div>
    <h1 id="p-titulo">Laboratorio de ciencias</h1>
    <p id="p-frase"></p>
    <div class="barra-carga"><i id="carga"></i></div>
    <p id="p-msg" class="p-msg">Preparando la mesa…</p>
    <button id="b-jugar" class="btn primario" type="button" disabled>Jugar</button>
    <p id="p-progreso" class="p-progreso"></p>
  </div>
</section>

<section id="final" class="portada" hidden>
  <div class="p-caja">
    <div class="p-icono">🏆</div>
    <h1 id="f-titulo"></h1>
    <p id="f-texto"></p>
    <div id="f-lista" class="f-lista"></div>
    <p id="f-total" class="f-total"></p>
    <div class="acciones">
      <button id="b-seguir" class="btn" type="button">Seguir en el laboratorio</button>
      <a class="btn primario" href="../index.html">Volver a los juegos</a>
    </div>
  </div>
</section>

<script src="../puente.js"></script>
<script src="datos.js"></script>
<script src="juego.js"></script>
</body>
</html>
