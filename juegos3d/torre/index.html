<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Torre de los Enigmas</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Lexend:wght@400;600;700&display=swap">
<link rel="stylesheet" href="juego.css">
</head>
<body>
<div id="gl" aria-hidden="true"></div>
<div id="cargando" class="cargando"><b>Torre de los Enigmas</b><span id="cmsg">Levantando la torre…</span></div>

<div id="hud" class="hud oculto">
  <div class="marcador" role="status" aria-live="off">
    <span class="ico" aria-hidden="true">🏰</span>
    <div><b id="hPiso">Piso 1</b><small id="hRecord"></small></div>
  </div>
  <div class="botones">
    <button class="hb" id="bSonido" type="button" aria-pressed="false" title="Sonido (S)"><span aria-hidden="true" id="iSonido">🔊</span><span class="sr" id="tSonido">Silenciar</span></button>
    <button class="hb" id="bCalma" type="button" aria-pressed="false" title="Modo calma (C)"><span aria-hidden="true">🐢</span><span>Calma</span></button>
    <button class="hb" id="bMenu" type="button" title="Pausa (Esc)"><span aria-hidden="true">☰</span><span class="sr">Pausa</span></button>
  </div>
</div>

<section id="carta" class="carta oculto" aria-labelledby="cPreg">
  <div class="ctag"><span class="fam" id="cFam"></span><span class="guardian oculto" id="cGuard"></span></div>
  <h2 id="cPreg"></h2>
  <p class="sub" id="cSub"></p>
  <div class="visual" id="cVis"></div>
  <div class="ops" id="cOps" role="group" aria-label="Opciones: elige con 1, 2, 3 o 4"></div>
  <div class="cbar">
    <button class="bsec" id="bPista" type="button">💡 Pista <small>(P)</small></button>
    <button class="bsec" id="bOir" type="button">🔊 Oír otra vez <small>(O)</small></button>
  </div>
  <div class="feed" id="cFeed" aria-live="polite"></div>
</section>
<div id="anuncio" class="sr" aria-live="polite"></div>

<!-- la sala de juegos: el inicio con todas las opciones -->
<div id="inicio" class="capa oculto">
  <div class="tarjeta" role="dialog" aria-labelledby="tTit">
    <h1 id="tTit"><span aria-hidden="true">🏰</span> Torre de los Enigmas</h1>
    <p class="frase">Sube la torre piso a piso: cada puerta se abre resolviendo un enigma. Sin reloj y sin vidas: si fallas, ves por qué y te sale otro.</p>
    <div class="paso" id="lGrado">1. Tu grado</div>
    <div class="fila-b" id="oGrado" role="group" aria-labelledby="lGrado"></div>
    <div class="paso" id="lIdioma">2. Las palabras, en</div>
    <div class="fila-b" id="oIdioma" role="group" aria-labelledby="lIdioma">
      <button type="button" data-idioma="es" aria-pressed="true">Español</button>
      <button type="button" data-idioma="en" aria-pressed="false" lang="en">English</button>
    </div>
    <div class="paso" id="lFam">3. Los enigmas</div>
    <div class="fila-b" id="oFam" role="group" aria-labelledby="lFam"></div>
    <label class="calma"><input type="checkbox" id="oCalma"> Modo calma: la torre quieta y sin animaciones</label>
    <p class="record" id="tRecord"></p>
    <p class="aviso" id="tAviso" aria-live="polite"></p>
    <div class="acciones">
      <button class="jugar" id="bSubir" type="button">▶ Subir a la torre</button>
      <a class="volver" href="../index.html">Volver a los juegos</a>
    </div>
  </div>
</div>

<!-- pausa -->
<div id="pausa" class="capa oculto">
  <div class="tarjeta" role="dialog" aria-labelledby="pTit" style="width:min(440px,100%);text-align:center">
    <h1 id="pTit" style="justify-content:center">En pausa</h1>
    <p class="frase" id="pRes"></p>
    <div class="acciones" style="justify-content:center">
      <button class="jugar" id="bSeguir" type="button">▶ Seguir subiendo</button>
      <button class="bsec" id="bInicio" type="button">Volver al inicio</button>
    </div>
  </div>
</div>

<script src="../puente.js"></script>
<script src="../leccion.js"></script>
<script src="enigmas.js"></script>
<script src="torre3d.js"></script>
<script src="juego.js"></script>
</body>
</html>
