<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Estudiantes con toga y birrete en el laboratorio del colegio">
  <defs>
    <linearGradient id="paredlab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef5f8"/><stop offset="100%" stop-color="#d7e5ec"/>
    </linearGradient>
    <linearGradient id="mesada" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfdae1"/><stop offset="100%" stop-color="#aebdc6"/>
    </linearGradient>
    <linearGradient id="toga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3240"/><stop offset="100%" stop-color="#181c26"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#paredlab)"/>
  <rect y="700" width="1200" height="200" fill="#b8c7d0"/>

  <!-- Estanteria con frascos -->
  <g>
    <rect x="60" y="150" width="300" height="14" rx="4" fill="#9aa9b3"/>
    <rect x="60" y="300" width="300" height="14" rx="4" fill="#9aa9b3"/>
    <g>
      <rect x="90" y="96" width="42" height="54" rx="6" fill="#7fc4a8" opacity=".9"/>
      <rect x="150" y="80" width="34" height="70" rx="6" fill="#e8b45c" opacity=".9"/>
      <rect x="202" y="104" width="46" height="46" rx="6" fill="#7aa7d8" opacity=".9"/>
      <rect x="266" y="86" width="38" height="64" rx="6" fill="#d18aa8" opacity=".9"/>
      <rect x="96" y="252" width="38" height="48" rx="6" fill="#8fd0c0" opacity=".9"/>
      <rect x="154" y="238" width="44" height="62" rx="6" fill="#a3b9e0" opacity=".9"/>
      <rect x="220" y="256" width="34" height="44" rx="6" fill="#e0a05c" opacity=".9"/>
    </g>
  </g>

  <!-- Tabla periodica -->
  <g>
    <rect x="880" y="130" width="250" height="180" rx="8" fill="#fbfdfe" stroke="#9aa9b3" stroke-width="5"/>
    <g fill="#8fb6cf">
      <rect x="900" y="152" width="26" height="26" rx="3"/><rect x="932" y="152" width="26" height="26" rx="3" fill="#e0a05c"/>
      <rect x="964" y="152" width="26" height="26" rx="3"/><rect x="996" y="152" width="26" height="26" rx="3" fill="#7fc4a8"/>
      <rect x="1028" y="152" width="26" height="26" rx="3"/><rect x="1060" y="152" width="26" height="26" rx="3" fill="#d18aa8"/>
      <rect x="900" y="184" width="26" height="26" rx="3" fill="#7fc4a8"/><rect x="932" y="184" width="26" height="26" rx="3"/>
      <rect x="964" y="184" width="26" height="26" rx="3" fill="#e0a05c"/><rect x="996" y="184" width="26" height="26" rx="3"/>
      <rect x="1028" y="184" width="26" height="26" rx="3" fill="#8fb6cf"/><rect x="1060" y="184" width="26" height="26" rx="3" fill="#7aa7d8"/>
      <rect x="900" y="216" width="26" height="26" rx="3"/><rect x="932" y="216" width="26" height="26" rx="3" fill="#d18aa8"/>
      <rect x="964" y="216" width="26" height="26" rx="3" fill="#7fc4a8"/><rect x="996" y="216" width="26" height="26" rx="3"/>
      <rect x="1028" y="216" width="26" height="26" rx="3" fill="#e0a05c"/><rect x="1060" y="216" width="26" height="26" rx="3"/>
      <rect x="900" y="248" width="26" height="26" rx="3" fill="#7aa7d8"/><rect x="932" y="248" width="26" height="26" rx="3"/>
      <rect x="964" y="248" width="26" height="26" rx="3"/><rect x="996" y="248" width="26" height="26" rx="3" fill="#7fc4a8"/>
      <rect x="1028" y="248" width="26" height="26" rx="3" fill="#d18aa8"/><rect x="1060" y="248" width="26" height="26" rx="3"/>
    </g>
  </g>

  <!-- Graduandos: toga negra, birrete y estola -->
  <g>
    <g transform="translate(360 560)">
      <path d="M-96 240 l24 -196 q6 -46 72 -56 q66 10 72 56 l24 196 z" fill="url(#toga)"/>
      <path d="M-30 -8 l30 40 l30 -40 l-14 -6 l-16 20 l-16 -20 z" fill="#f4f7f9"/>
      <path d="M-24 -12 l-10 210 h22 l14 -196 z M24 -12 l10 210 h-22 l-14 -196 z" fill="#e0543f"/>
      <circle cx="0" cy="-48" r="44" fill="#c78a5a"/>
      <path d="M-40 -62 q8 -40 40 -40 q32 0 40 40 q-18 -18 -40 -18 q-24 0 -40 18z" fill="#241a14"/>
      <rect x="-14" y="-104" width="28" height="18" rx="4" fill="#20242e"/>
      <path d="M-72 -108 h144 l-72 -34 z" fill="#20242e"/>
      <rect x="-74" y="-112" width="148" height="10" rx="4" fill="#20242e"/>
      <path d="M0 -112 h56 l-8 74" stroke="#e8b45c" stroke-width="5" fill="none"/>
      <circle cx="48" cy="-38" r="8" fill="#e8b45c"/>
    </g>

    <g transform="translate(600 585)">
      <path d="M-92 215 l22 -176 q6 -44 70 -54 q64 10 70 54 l22 176 z" fill="url(#toga)"/>
      <path d="M-28 -8 l28 38 l28 -38 l-13 -6 l-15 19 l-15 -19 z" fill="#f4f7f9"/>
      <path d="M-22 -12 l-10 190 h20 l14 -178 z M22 -12 l10 190 h-20 l-14 -178 z" fill="#3fa796"/>
      <circle cx="0" cy="-46" r="42" fill="#eac09a"/>
      <path d="M-40 -56 q10 -44 40 -44 q30 0 40 44 q-12 -34 -40 -34 q-28 0 -40 34z" fill="#6b4a2a"/>
      <path d="M-42 -46 q-14 46 6 62 M42 -46 q14 46 -6 62" fill="#6b4a2a"/>
      <rect x="-13" y="-100" width="26" height="18" rx="4" fill="#20242e"/>
      <path d="M-68 -104 h136 l-68 -32 z" fill="#20242e"/>
      <rect x="-70" y="-108" width="140" height="10" rx="4" fill="#20242e"/>
      <path d="M0 -108 h-52 l6 70" stroke="#e8b45c" stroke-width="5" fill="none"/>
      <circle cx="-46" cy="-36" r="8" fill="#e8b45c"/>
    </g>

    <g transform="translate(840 575)">
      <path d="M-94 225 l23 -186 q6 -45 71 -55 q65 10 71 55 l23 186 z" fill="url(#toga)"/>
      <path d="M-29 -8 l29 39 l29 -39 l-13 -6 l-16 20 l-16 -20 z" fill="#f4f7f9"/>
      <path d="M-23 -12 l-10 200 h21 l14 -188 z M23 -12 l10 200 h-21 l-14 -188 z" fill="#7a5fc0"/>
      <circle cx="0" cy="-48" r="43" fill="#8a5a3c"/>
      <path d="M-40 -66 q40 -30 80 4 q-6 -38 -40 -38 q-36 0 -40 34z" fill="#221812"/>
      <rect x="-13" y="-102" width="26" height="18" rx="4" fill="#20242e"/>
      <path d="M-70 -106 h140 l-70 -33 z" fill="#20242e"/>
      <rect x="-72" y="-110" width="144" height="10" rx="4" fill="#20242e"/>
      <path d="M0 -110 h54 l-7 72" stroke="#e8b45c" stroke-width="5" fill="none"/>
      <circle cx="47" cy="-37" r="8" fill="#e8b45c"/>
    </g>
  </g>

  <!-- Mesada y material. El frente del mueble va DESPUÉS de los graduandos y llega hasta abajo:
       sin él, las togas seguían pintándose por delante y parecía que atravesaban la mesa. -->
  <rect x="0" y="700" width="1200" height="34" fill="url(#mesada)"/>
  <rect x="0" y="734" width="1200" height="14" fill="#93a5b0"/>
  <rect x="0" y="748" width="1200" height="152" fill="#b9c8d1"/>
  <g fill="#aab9c3">
    <rect x="60" y="772" width="300" height="104" rx="6"/>
    <rect x="450" y="772" width="300" height="104" rx="6"/>
    <rect x="840" y="772" width="300" height="104" rx="6"/>
  </g>
  <g fill="#8fa1ad">
    <rect x="196" y="816" width="28" height="10" rx="5"/>
    <rect x="586" y="816" width="28" height="10" rx="5"/>
    <rect x="976" y="816" width="28" height="10" rx="5"/>
  </g>

  <!-- Erlenmeyer -->
  <g transform="translate(200 700)">
    <path d="M-10 -96 h20 v40 l40 56 h-100 l40 -56 z" fill="#dff1f7" stroke="#8fb0c0" stroke-width="5"/>
    <path d="M-38 -24 l-12 24 h100 l-12 -24 z" fill="#5ec48f"/>
    <circle cx="-6" cy="-46" r="5" fill="#5ec48f" opacity=".7"/><circle cx="10" cy="-64" r="4" fill="#5ec48f" opacity=".5"/>
  </g>
  <!-- Vaso de precipitados -->
  <g transform="translate(320 700)">
    <path d="M-34 -76 h68 v76 h-68 z" fill="#dff1f7" stroke="#8fb0c0" stroke-width="5"/>
    <path d="M-32 -34 h64 v32 h-64 z" fill="#5aa9d8"/>
    <path d="M-24 -62 h14 M-24 -48 h14" stroke="#8fb0c0" stroke-width="4"/>
  </g>
  <!-- Gradilla con tubos -->
  <g transform="translate(1000 700)">
    <rect x="-70" y="-16" width="140" height="16" rx="4" fill="#8a6242"/>
    <rect x="-70" y="-86" width="140" height="10" rx="4" fill="#8a6242"/>
    <g stroke="#8fb0c0" stroke-width="4">
      <rect x="-52" y="-104" width="22" height="96" rx="11" fill="#dff1f7"/>
      <rect x="-12" y="-104" width="22" height="96" rx="11" fill="#dff1f7"/>
      <rect x="28" y="-104" width="22" height="96" rx="11" fill="#dff1f7"/>
    </g>
    <rect x="-50" y="-58" width="18" height="48" rx="9" fill="#e0543f"/>
    <rect x="-10" y="-44" width="18" height="34" rx="9" fill="#e8b45c"/>
    <rect x="30" y="-66" width="18" height="56" rx="9" fill="#7a5fc0"/>
  </g>
  <!-- Microscopio -->
  <g transform="translate(490 700)">
    <rect x="-46" y="-10" width="92" height="12" rx="6" fill="#4c5b66"/>
    <path d="M-6 -12 v-56 q0 -30 30 -34" stroke="#4c5b66" stroke-width="14" fill="none" stroke-linecap="round"/>
    <rect x="14" y="-108" width="20" height="46" rx="8" fill="#37444d"/>
    <rect x="-34" y="-40" width="52" height="8" rx="3" fill="#37444d"/>
  </g>
</svg>
