<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Campus universitario de ladrillo con torre de reloj">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fc4e8"/><stop offset="55%" stop-color="#cfe3f2"/><stop offset="100%" stop-color="#f6e0c4"/>
    </linearGradient>
    <linearGradient id="cesped" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cae5c"/><stop offset="100%" stop-color="#4f8340"/>
    </linearGradient>
    <linearGradient id="ladrillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b25c46"/><stop offset="100%" stop-color="#8f4433"/>
    </linearGradient>
    <pattern id="hiladas" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="url(#ladrillo)"/>
      <path d="M0 20 H40 M20 0 V10 M0 10 H40 M0 10 V20" stroke="#00000018" stroke-width="2"/>
    </pattern>
    <radialGradient id="sol" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff6d8" stop-opacity="1"/><stop offset="100%" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#cielo)"/>
  <circle cx="960" cy="180" r="200" fill="url(#sol)"/>
  <circle cx="960" cy="180" r="52" fill="#fff3cf"/>
  <g fill="#ffffff" opacity=".55">
    <ellipse cx="220" cy="150" rx="90" ry="34"/><ellipse cx="290" cy="140" rx="70" ry="28"/>
    <ellipse cx="820" cy="105" rx="72" ry="26"/><ellipse cx="880" cy="115" rx="54" ry="20"/>
  </g>

  <rect y="640" width="1200" height="260" fill="url(#cesped)"/>

  <!-- Cuerpo principal -->
  <rect x="255" y="415" width="690" height="230" fill="url(#hiladas)"/>
  <rect x="255" y="405" width="690" height="18" fill="#f4f1ea"/>

  <!-- Torre del reloj -->
  <rect x="545" y="255" width="110" height="165" fill="url(#hiladas)"/>
  <rect x="536" y="245" width="128" height="16" fill="#f4f1ea"/>
  <path d="M536 245 L600 175 L664 245 Z" fill="#f4f1ea"/>
  <path d="M572 175 h56 v-22 h-56 z" fill="#f4f1ea"/>
  <path d="M600 100 L600 153" stroke="#f4f1ea" stroke-width="7"/>
  <circle cx="600" cy="96" r="10" fill="#e8c46a"/>
  <circle cx="600" cy="318" r="30" fill="#f6f3ec"/>
  <circle cx="600" cy="318" r="30" fill="none" stroke="#5e3125" stroke-width="4"/>
  <path d="M600 318 V300 M600 318 L613 326" stroke="#5e3125" stroke-width="4" stroke-linecap="round"/>

  <!-- Pórtico -->
  <path d="M420 415 L600 340 L780 415 Z" fill="#f4f1ea"/>
  <rect x="420" y="415" width="360" height="14" fill="#e7e2d6"/>
  <g fill="#f8f6f0">
    <rect x="442" y="429" width="30" height="216" rx="6"/>
    <rect x="512" y="429" width="30" height="216" rx="6"/>
    <rect x="582" y="429" width="30" height="216" rx="6"/>
    <rect x="652" y="429" width="30" height="216" rx="6"/>
    <rect x="722" y="429" width="30" height="216" rx="6"/>
  </g>
  <rect x="565" y="520" width="70" height="125" rx="4" fill="#6b4433"/>
  <rect x="573" y="530" width="54" height="105" rx="3" fill="#8a5c45"/>

  <!-- Ventanas -->
  <g>
    <g fill="#f4f1ea">
      <rect x="290" y="450" width="42" height="66" rx="20"/><rect x="352" y="450" width="42" height="66" rx="20"/>
      <rect x="806" y="450" width="42" height="66" rx="20"/><rect x="868" y="450" width="42" height="66" rx="20"/>
      <rect x="290" y="545" width="42" height="66" rx="20"/><rect x="352" y="545" width="42" height="66" rx="20"/>
      <rect x="806" y="545" width="42" height="66" rx="20"/><rect x="868" y="545" width="42" height="66" rx="20"/>
    </g>
    <g fill="#8fb6cf">
      <rect x="296" y="456" width="30" height="54" rx="15"/><rect x="358" y="456" width="30" height="54" rx="15"/>
      <rect x="812" y="456" width="30" height="54" rx="15"/><rect x="874" y="456" width="30" height="54" rx="15"/>
      <rect x="296" y="551" width="30" height="54" rx="15"/><rect x="358" y="551" width="30" height="54" rx="15"/>
      <rect x="812" y="551" width="30" height="54" rx="15"/><rect x="874" y="551" width="30" height="54" rx="15"/>
    </g>
  </g>

  <!-- Camino y arboles -->
  <path d="M520 645 H680 L800 900 H400 Z" fill="#d9cdb4"/>
  <path d="M600 645 V900" stroke="#cbbc9d" stroke-width="4"/>
  <g>
    <rect x="150" y="560" width="26" height="110" fill="#7a5236"/>
    <circle cx="163" cy="520" r="88" fill="#3f7a3c"/><circle cx="108" cy="560" r="58" fill="#4a8c46"/><circle cx="218" cy="558" r="62" fill="#356b34"/>
    <rect x="1020" y="575" width="24" height="98" fill="#7a5236"/>
    <circle cx="1032" cy="535" r="80" fill="#3f7a3c"/><circle cx="982" cy="572" r="52" fill="#4a8c46"/><circle cx="1082" cy="570" r="56" fill="#356b34"/>
  </g>

  <!-- Estudiantes -->
  <g>
    <g transform="translate(470 690)">
      <circle cx="0" cy="-46" r="15" fill="#7d4b30"/><path d="M-16 -30 h32 l7 62 h-46 z" fill="#2f6f9e"/><path d="M-9 32 v34 M9 32 v34" stroke="#31405a" stroke-width="9" stroke-linecap="round"/>
    </g>
    <g transform="translate(700 720)">
      <circle cx="0" cy="-50" r="16" fill="#c58a5f"/><path d="M-17 -33 h34 l8 66 h-50 z" fill="#c9543f"/><path d="M-10 35 v36 M10 35 v36" stroke="#31405a" stroke-width="10" stroke-linecap="round"/>
    </g>
    <g transform="translate(560 780)">
      <circle cx="0" cy="-54" r="17" fill="#eac09a"/><path d="M-18 -36 h36 l9 72 h-54 z" fill="#f0b429"/><path d="M-11 38 v38 M11 38 v38" stroke="#31405a" stroke-width="11" stroke-linecap="round"/>
    </g>
  </g>
</svg>
