		<!--
			EL ICONO DE LA PESTAÑA, Y POR QUE LA VIEJA ENSEÑA EL DE MyVC SIN TENERLO.

			Esta linea la escribe `ng new`, y con ella venia tambien el `favicon.ico` de
			Angular: la pestaña de `up2/` salia con la «A» roja. La vieja no lo arregla,
			LO ESQUIVA -- su `index.html` construido no declara ningun icono, asi que
			Chrome cae en el de la RAIZ DEL DOMINIO, que alguien dejo alli a mano:

			    <colegio>/favicon.ico       200  image/x-icon  1150   el de MyVC
			    <colegio>/up/favicon.ico    200  image/x-icon  4286   un bigotudo del
			                                                         andamiaje viejo,
			                                                         que no pide nadie
			    <colegio>/up2/favicon.ico   200  image/x-icon         este, y por eso
			                                                         gana al de la raiz

			Medido el 2026-09-01 en `coal`, `casb`, `coljordan` y `lalvirtual`: el de la
			raiz es el MISMO fichero en los cuatro (un solo 16x16). O sea que quitar esta
			linea tambien «funcionaria», pero dejaria el icono fuera del despliegue y a
			merced de un fichero suelto del servidor. Se declara, y el fichero viaja.

			`public/favicon.ico` es ahora el logo de MyVC a 16, 32 y 48, sacado de
			`app/public/images/MyVc.png` -- la misma imagen de la que salio el de la
			raiz, que solo trae el 16 y se ve borroso en pantallas densas.
		-->
		<link rel="icon" type="image/x-icon" href="favicon.ico">
